name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  bundle:
    name: Signed release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HYDRO_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hydro-upload.jks"
          echo "HYDRO_KEYSTORE_PATH=$RUNNER_TEMP/hydro-upload.jks" >> "$GITHUB_ENV"

      - name: Build signed AAB and APK
        env:
          HYDRO_KEYSTORE_PASSWORD: ${{ secrets.HYDRO_KEYSTORE_PASSWORD }}
          HYDRO_KEY_ALIAS: ${{ secrets.HYDRO_KEY_ALIAS }}
          HYDRO_KEY_PASSWORD: ${{ secrets.HYDRO_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hydro-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/hydro-upload.jks"
